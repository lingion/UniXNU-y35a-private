name: Y35A CI RAM-boot package

on:
  push:
    paths:
      - '.github/workflows/y35a-ci-package.yml'
      - '.github/workflows/unixnu-native-build.yml'
      - 'ci/manifests/r208-tf-sd-driver.json'
      - 'ci/manifests/r208-tf-apfs-package-contract.json'
      - 'ci/native-build-manifest.r208.json'
      - 'ci/native-build-manifest.r208-fallback-v2.json'
      - 'ci/native-source-provenance.r208-fallback-v2.json'
      - 'ci/manifests/r208-tf-emmc-root-fallback-v2-candidate.json'
      - 'ci/native-build-manifest.r208-fallback-v3.json'
      - 'ci/native-source-provenance.r208-fallback-v3.json'
      - 'ci/manifests/r208-tf-emmc-root-fallback-v3-candidate.json'
      - 'ci/y35a-ci-package-manifest.json'
      - 'evidence/y35a-20261102/boot3-20261106/touch-t02-20261109/dtb10-cache/dtb10.dts'
      - 'evidence/y35a-20261102/stock-boot.img'
      - 'scripts/ci/build_y35a_ci_package.py'
      - 'scripts/ci/build_y35a_tf_apfs_image.py'
      - 'scripts/ci/extract_y35a_stock_qcdt.py'
      - 'scripts/ci/build_y35a_system_apfs_control.py'
      - 'scripts/ci/verify_r208_fallback_v2_source.py'
      - 'scripts/ci/verify_r208_fallback_v3_source.py'
      - 'scripts/ci/build_y35a_qcdt.py'
      - 'scripts/ci/extract_ios12_package_inputs.py'
      - 'scripts/ci/verify_y35a_trustcache.py'
      - 'scripts/ci/prepare_native_inputs.py'
      - 'scripts/ci/patch_xnu_host_tools.py'
      - 'scripts/ci/run_native_build.py'
      - 'scripts/ci/verify_r208_native_kernel.py'
      - 'scripts/ci/compile_r208_sdcard.py'
      - 'ci/native-source-provenance.r208.json'
      - 'scripts/build-xnu-4903-native.py'
      - 'scripts/stage-ios12-root.py'
      - 'scripts/unixnu/ipsw.py'
      - 'scripts/unixnu/devicetree.py'
      - 'scripts/unixnu/udif.py'
      - 'scripts/unixnu/util.py'
      - 'scripts/y35a/boot_layout.py'
      - 'scripts/y35a/make_adt.py'
      - 'scripts/y35a/package_native.py'
      - 'patches/xnu/native-y35a-tf-emmc-root-fallback-v2.patch'
      - 'patches/xnu/native-y35a-tf-emmc-root-fallback-v3.patch'
      - 'scripts/y35a/verify_r208_tf_apfs_package_contract.py'
      - 'patches/xnu/native-y35a-tf-emmc-root-fallback-v2.patch'
      - 'tests/test_ci_y35a_package.py'
      - 'tests/test_ci_native_input_prep.py'
      - 'tests/test_r208_storage_abi_contract.py'
      - 'tests/test_r208_tf_apfs_package_contract.py'
      - 'tests/test_y35a_tf_apfs_image.py'
      - 'tests/test_y35a_tf_emmc_root_fallback_v2_patch.py'
      - 'tests/test_y35a_tf_emmc_root_fallback_v3_patch.py'
      - 'tests/test_r208_native_kernel_gate.py'
      - 'tests/test_y35a_system_apfs_control.py'
  pull_request:
    paths:
      - '.github/workflows/y35a-ci-package.yml'
      - '.github/workflows/unixnu-native-build.yml'
      - 'ci/manifests/r208-tf-sd-driver.json'
      - 'ci/manifests/r208-tf-apfs-package-contract.json'
      - 'ci/native-build-manifest.r208.json'
      - 'ci/native-build-manifest.r208-fallback-v2.json'
      - 'ci/native-source-provenance.r208-fallback-v2.json'
      - 'ci/manifests/r208-tf-emmc-root-fallback-v2-candidate.json'
      - 'ci/native-build-manifest.r208-fallback-v3.json'
      - 'ci/native-source-provenance.r208-fallback-v3.json'
      - 'ci/manifests/r208-tf-emmc-root-fallback-v3-candidate.json'
      - 'ci/y35a-ci-package-manifest.json'
      - 'evidence/y35a-20261102/boot3-20261106/touch-t02-20261109/dtb10-cache/dtb10.dts'
      - 'evidence/y35a-20261102/stock-boot.img'
      - 'scripts/ci/build_y35a_ci_package.py'
      - 'scripts/ci/build_y35a_tf_apfs_image.py'
      - 'scripts/ci/extract_y35a_stock_qcdt.py'
      - 'scripts/ci/build_y35a_system_apfs_control.py'
      - 'scripts/ci/verify_r208_fallback_v2_source.py'
      - 'scripts/ci/verify_r208_fallback_v3_source.py'
      - 'scripts/ci/build_y35a_qcdt.py'
      - 'scripts/ci/extract_ios12_package_inputs.py'
      - 'scripts/ci/verify_y35a_trustcache.py'
      - 'scripts/ci/prepare_native_inputs.py'
      - 'scripts/ci/patch_xnu_host_tools.py'
      - 'scripts/ci/run_native_build.py'
      - 'scripts/ci/verify_r208_native_kernel.py'
      - 'scripts/ci/compile_r208_sdcard.py'
      - 'ci/native-source-provenance.r208.json'
      - 'scripts/build-xnu-4903-native.py'
      - 'scripts/stage-ios12-root.py'
      - 'scripts/unixnu/ipsw.py'
      - 'scripts/unixnu/devicetree.py'
      - 'scripts/unixnu/udif.py'
      - 'scripts/unixnu/util.py'
      - 'scripts/y35a/boot_layout.py'
      - 'scripts/y35a/make_adt.py'
      - 'scripts/y35a/package_native.py'
      - 'patches/xnu/native-y35a-tf-emmc-root-fallback-v2.patch'
      - 'patches/xnu/native-y35a-tf-emmc-root-fallback-v3.patch'
      - 'scripts/y35a/verify_r208_tf_apfs_package_contract.py'
      - 'patches/xnu/native-y35a-tf-emmc-root-fallback-v2.patch'
      - 'tests/test_ci_y35a_package.py'
      - 'tests/test_ci_native_input_prep.py'
      - 'tests/test_r208_storage_abi_contract.py'
      - 'tests/test_r208_tf_apfs_package_contract.py'
      - 'tests/test_y35a_tf_apfs_image.py'
      - 'tests/test_y35a_tf_emmc_root_fallback_v2_patch.py'
      - 'tests/test_y35a_tf_emmc_root_fallback_v3_patch.py'
      - 'tests/test_r208_native_kernel_gate.py'
      - 'tests/test_y35a_system_apfs_control.py'
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful UniXNU native build Actions run on this branch
        required: false
        default: ''
        type: string
      native_head_branch:
        description: Branch of the exact native build run
        required: false
        default: ''
        type: string
      native_head_sha:
        description: Full commit SHA of the exact native build run
        required: false
        default: ''
        type: string
      native_artifact_id:
        description: Exact unixnu-kernel artifact ID from the selected native run
        required: false
        default: ''
        type: string
      native_artifact_digest:
        description: Exact artifact API digest including sha256 prefix
        required: false
        default: ''
        type: string
      native_manifest_path:
        description: Exact native build manifest used by the native artifact
        required: false
        default: ci/native-build-manifest.r208.json
        type: string
      root_tree_run_id:
        description: Actions run containing a root-tree artifact for TF/APFS intermediate packaging
        required: false
        default: ''
        type: string
      root_tree_artifact:
        description: Must be the multi-file y35a-root-tree-<run_id> artifact (not the single-file root-tree.tar artifact)
        required: false
        default: ''
        type: string
      root_tree_path:
        description: Metadata-preserving root-tree.tar path inside the root-tree artifact
        required: false
        default: ''
        type: string
      stock_boot_path:
        description: Tracked repository-relative path to the original full PD1502A stock boot image (64 MiB, pinned SHA-256); leave empty until supplied
        required: false
        default: ''
        type: string
      system_root_run_id:
        description: Successful package Actions run that produced the exact pinned System-volume source artifact
        required: false
        default: ''
        type: string
      system_root_artifact_id:
        description: Exact ID of y35a-ios12-system-root-<run_id>
        required: false
        default: ''
        type: string
      system_root_artifact_digest:
        description: Exact source artifact API digest including sha256 prefix
        required: false
        default: ''
        type: string
      control_package_run_id:
        description: Successful RAM diagnostic package run for offline derived-QCDT control only
        required: false
        default: ''
        type: string
      control_package_artifact_id:
        description: Exact y35a-ramboot artifact ID from that run
        required: false
        default: ''
        type: string
      control_package_artifact_digest:
        description: 'Exact artifact API digest, including sha256: prefix'
        required: false
        default: ''
        type: string
      control_root_tree_artifact_id:
        description: Exact single-file root-tree.tar artifact ID from the package run
        required: false
        default: ''
        type: string
      control_root_tree_artifact_digest:
        description: 'Exact root-tree.tar artifact API digest, including sha256: prefix'
        required: false
        default: ''
        type: string
  workflow_run:
    workflows:
      - UniXNU native build
    branches:
      - main
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: y35a-ci-package-${{ github.event.workflow_run.id || inputs.native_run_id || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      native_run_id: ${{ steps.native.outputs.run_id }}
      native_head_sha: ${{ steps.native.outputs.head_sha }}
      package_source_sha: ${{ steps.package_source.outputs.sha }}
      native_manifest_path: ${{ steps.native_manifest.outputs.path }}
      native_artifact_id: ${{ steps.native.outputs.artifact_id }}
      native_artifact_digest: ${{ steps.native.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test package contracts
        run: python -m unittest -v tests/test_ci_y35a_package.py tests/test_ci_native_input_prep.py tests/test_r208_storage_abi_contract.py tests/test_r208_tf_apfs_package_contract.py tests/test_y35a_tf_apfs_image.py tests/test_y35a_system_apfs_control.py tests/test_y35a_tf_emmc_root_fallback_v2_patch.py tests/test_y35a_tf_emmc_root_fallback_v3_patch.py tests/test_r208_native_kernel_gate.py
      - name: Verify fallback v3 patch chain applies to exact XNU source
        run: python scripts/ci/verify_r208_fallback_v3_source.py --manifest ci/native-build-manifest.r208-fallback-v3.json --repo-root .
      - name: Validate R208 TF/APFS device-package design contract
        run: |
          python3 scripts/y35a/verify_r208_tf_apfs_package_contract.py \
            --contract ci/manifests/r208-tf-apfs-package-contract.json
      - name: Resolve package source SHA
        id: package_source
        env:
          PACKAGE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$PACKAGE_SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Resolve native manifest selection
        id: native_manifest
        env:
          REQUESTED_NATIVE_MANIFEST: ${{ inputs.native_manifest_path }}
        run: |
          set -euo pipefail
          case "${REQUESTED_NATIVE_MANIFEST:-}" in
            ""|ci/native-build-manifest.r208.json)
              NATIVE_MANIFEST=ci/native-build-manifest.r208.json ;;
            ci/native-build-manifest.r208-fallback-v2.json)
              NATIVE_MANIFEST=ci/native-build-manifest.r208-fallback-v2.json ;;
            ci/native-build-manifest.r208-fallback-v3.json)
              NATIVE_MANIFEST=ci/native-build-manifest.r208-fallback-v3.json ;;
            *)
              echo "unsupported native manifest selection: $REQUESTED_NATIVE_MANIFEST" >&2
              exit 1 ;;
          esac
          test -f "$NATIVE_MANIFEST"
          echo "path=$NATIVE_MANIFEST" >> "$GITHUB_OUTPUT"
      - name: Resolve successful native run
        id: native
        if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.native_run_id != '')
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ github.event.workflow_run.id || inputs.native_run_id }}
          NATIVE_TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.native_head_branch || github.ref_name }}
          NATIVE_TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.native_head_sha || github.sha }}
          EXPECTED_NATIVE_ARTIFACT_ID: ${{ inputs.native_artifact_id }}
          EXPECTED_NATIVE_ARTIFACT_DIGEST: ${{ inputs.native_artifact_digest }}
        run: |
          set -euo pipefail
          if [[ ! "$NATIVE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "native_run_id must be a decimal Actions run ID" >&2
            exit 1
          fi
          gh run view "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,workflowName,conclusion,headBranch,headSha \
            > "$RUNNER_TEMP/native-run.json"
          jq -e --arg id "$NATIVE_RUN_ID" \
            --arg branch "$NATIVE_TARGET_BRANCH" \
            --arg sha "$NATIVE_TARGET_SHA" '
            .databaseId == ($id | tonumber)
            and .workflowName == "UniXNU native build"
            and .conclusion == "success"
            and .headBranch == $branch
            and .headSha == $sha
            and (.headSha | test("^[0-9a-f]{40}$"))
          ' "$RUNNER_TEMP/native-run.json" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN_ID/artifacts" \
            > "$RUNNER_TEMP/native-artifacts.json"
          ARTIFACT_NAME="unixnu-kernel-$NATIVE_RUN_ID"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$EXPECTED_NATIVE_ARTIFACT_ID" =~ ^[0-9]+$ ]]
            [[ "$EXPECTED_NATIVE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
          MATCHES=$(jq -c --arg name "$ARTIFACT_NAME" --argjson run "$NATIVE_RUN_ID" \
            --arg sha "$NATIVE_TARGET_SHA" '
            [.artifacts[] | select(.name == $name and .expired == false
              and .workflow_run.id == $run and .workflow_run.head_sha == $sha)]' \
            "$RUNNER_TEMP/native-artifacts.json")
          if [[ "$(jq 'length' <<< "$MATCHES")" != 1 ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "selected successful run must have exactly one matching unexpired $ARTIFACT_NAME artifact" >&2
              exit 1
            fi
            echo "::notice::successful native run has no kernel artifact, likely plan-only; package skipped"
            exit 0
          fi
          ARTIFACT_ID=$(jq -r '.[0].id' <<< "$MATCHES")
          ARTIFACT_DIGEST=$(jq -r '.[0].digest' <<< "$MATCHES")
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && \
                ("$ARTIFACT_ID" != "$EXPECTED_NATIVE_ARTIFACT_ID" || \
                 "$ARTIFACT_DIGEST" != "$EXPECTED_NATIVE_ARTIFACT_DIGEST") ]]; then
            echo "native kernel artifact ID/digest do not match the explicitly selected artifact" >&2
            exit 1
          fi
          echo "run_id=$NATIVE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.headSha' "$RUNNER_TEMP/native-run.json")" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"

  package:
    needs: validate
    if: needs.validate.outputs.native_run_id != ''
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.package_source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Android NDK cross tools
        uses: android-actions/setup-android@7731365548f3f81c15d4c49c8f1d29101e02cdcf
        with:
          packages: 'ndk;27.0.12077973'
      - uses: actions/checkout@v4
        with:
          repository: dgibson/dtc
          ref: 2d10aa2afe35527728db30b35ec491ecb6959e5c
          path: .ci-tools/dtc
          persist-credentials: false
      - name: Download hash-bound native kernel
        uses: actions/download-artifact@v4
        with:
          name: unixnu-kernel-${{ needs.validate.outputs.native_run_id }}
          run-id: ${{ needs.validate.outputs.native_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-kernel
      - name: Select and record cross tools
        run: |
          set -euo pipefail
          export DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          NDK_REVISION="27.0.12077973"
          NDK_ROOT="$SDK_ROOT/ndk/$NDK_REVISION"
          test -d "$NDK_ROOT"
          if [[ "$(uname -m)" == "arm64" ]]; then
            HOST_TAGS=(darwin-arm64 darwin-x86_64)
          else
            HOST_TAGS=(darwin-x86_64 darwin-arm64)
          fi
          HOST_TAG=""
          for tag in "${HOST_TAGS[@]}"; do
            if [[ -x "$NDK_ROOT/toolchains/llvm/prebuilt/$tag/bin/ld.lld" && \
                  -x "$NDK_ROOT/toolchains/llvm/prebuilt/$tag/bin/llvm-objcopy" ]]; then
              HOST_TAG="$tag"
              break
            fi
          done
          test -n "$HOST_TAG"
          CLANG="$(xcrun --find clang)"
          LLD="$NDK_ROOT/toolchains/llvm/prebuilt/$HOST_TAG/bin/ld.lld"
          OBJCOPY="$NDK_ROOT/toolchains/llvm/prebuilt/$HOST_TAG/bin/llvm-objcopy"
          echo "CLANG=$CLANG" >> "$GITHUB_ENV"
          echo "LLVM_OBJCOPY=$OBJCOPY" >> "$GITHUB_ENV"
          echo "LLVM_LLD=$LLD" >> "$GITHUB_ENV"
          echo "$(dirname "$LLD")" >> "$GITHUB_PATH"
          "$CLANG" --version
          "$OBJCOPY" --version
          "$LLD" --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          PACKAGE_TOOLCHAIN_MANIFEST="$RUNNER_TEMP/y35a-package-toolchain.json"
          python3 - "$PACKAGE_TOOLCHAIN_MANIFEST" "$NDK_REVISION" "$NDK_ROOT" "$HOST_TAG" "$CLANG" "$LLD" "$OBJCOPY" <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path
          output, revision, ndk_root, host_tag, *tool_paths = sys.argv[1:]
          tools = {}
          names = ("clang", "ld.lld", "llvm-objcopy")
          for name, raw_path in zip(names, tool_paths):
              # Keep the tool entry name (especially ld.lld) intact; resolving
              # this NDK symlink changes its linker-driver behavior.
              path = Path(raw_path).absolute()
              if not path.is_file() or not path.stat().st_mode & 0o111:
                  raise SystemExit(f"tool is not executable: {name}: {path}")
              result = subprocess.run([str(path), "--version"], capture_output=True, text=True, check=True)
              text = result.stdout or result.stderr
              version = text.splitlines()[0] if text else "version output unavailable"
              tools[name] = {
                  "path": str(path),
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "version": version,
              }
          Path(output).write_text(json.dumps({
              "schema": 1,
              "android_ndk": {"revision": revision, "root": str(Path(ndk_root).resolve()),
                              "host_tag": host_tag},
              "tools": tools,
          }, indent=2, sort_keys=True) + "\n")
          PY
          echo "PACKAGE_TOOLCHAIN_MANIFEST=$PACKAGE_TOOLCHAIN_MANIFEST" >> "$GITHUB_ENV"
      - name: Build pinned device-tree compiler
        env:
          DTC_REVISION: 2d10aa2afe35527728db30b35ec491ecb6959e5c
        run: |
          set -euo pipefail
          test "$(git -C .ci-tools/dtc rev-parse HEAD)" = "$DTC_REVISION"
          test "$(python3 -c 'import json; print(json.load(open("ci/y35a-ci-package-manifest.json"))["dtc"]["commit"])')" = "$DTC_REVISION"
          # The pinned dtc's generated Flex C has one signedness warning under
          # Apple clang; suppress only that warning class and GCC-only unknown
          # warning options while keeping -Werror for all other diagnostics.
          make -C .ci-tools/dtc dtc \
            EXTRA_CFLAGS='-Wno-error=unknown-warning-option -Wno-error=sign-compare'
      - name: Download pinned iOS 12.4.1 firmware
        run: |
          set -euo pipefail
          IPSW_URL="$(python3 -c 'import json; print(json.load(open("ci/y35a-ci-package-manifest.json"))["firmware"]["url"])')"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/ios-12.4.1-16G102.ipsw" "$IPSW_URL"
      - name: Build and verify RAM-boot package
        env:
          NATIVE_RUN_ID: ${{ needs.validate.outputs.native_run_id }}
          NATIVE_HEAD_SHA: ${{ needs.validate.outputs.native_head_sha }}
          NATIVE_ARTIFACT_ID: ${{ needs.validate.outputs.native_artifact_id }}
          NATIVE_ARTIFACT_DIGEST: ${{ needs.validate.outputs.native_artifact_digest }}
          NATIVE_BUILD_MANIFEST_PATH: ${{ needs.validate.outputs.native_manifest_path }}
          PACKAGE_SOURCE_SHA: ${{ needs.validate.outputs.package_source_sha }}
          PACKAGE_RUN_ID: ${{ github.run_id }}
          PACKAGE_TOOLCHAIN_MANIFEST: ${{ runner.temp }}/y35a-package-toolchain.json
          DTC_REVISION: 2d10aa2afe35527728db30b35ec491ecb6959e5c
        run: |
          set -euo pipefail
          python3 scripts/ci/build_y35a_ci_package.py \
            --native-run-id "$NATIVE_RUN_ID" \
            --native-head-sha "$NATIVE_HEAD_SHA" \
            --native-artifact-id "$NATIVE_ARTIFACT_ID" \
            --native-artifact-digest "$NATIVE_ARTIFACT_DIGEST" \
            --native-artifact-dir "$RUNNER_TEMP/native-kernel" \
            --native-manifest "$NATIVE_BUILD_MANIFEST_PATH" \
            --package-source-sha "$PACKAGE_SOURCE_SHA" \
            --package-run-id "$PACKAGE_RUN_ID" \
            --ipsw "$RUNNER_TEMP/ios-12.4.1-16G102.ipsw" \
            --system-root-output-dir "$RUNNER_TEMP/y35a-ios12-system-root" \
            --dtc .ci-tools/dtc/dtc \
            --dtc-revision "$DTC_REVISION" \
            --compiler "$CLANG" \
            --linker "$LLVM_LLD" \
            --objcopy "$LLVM_OBJCOPY" \
            --toolchain-manifest "$PACKAGE_TOOLCHAIN_MANIFEST" \
            --output "$RUNNER_TEMP/y35a-ramboot-package"
          cd "$RUNNER_TEMP/y35a-ramboot-package"
          shasum -a 256 -c SHA256SUMS
          jq -e '.status == "offline-package-complete" and .package.static_container_checks == "passed" and .native_build_status == "complete" and .trust_cache.combined.coverage.coverage == "complete" and .trust_cache.combined.coverage.staged_macho_count == 58' package-provenance.json > /dev/null
          {
            echo "## Y35A RAM-boot package"
            echo
            echo "Native Actions run: $NATIVE_RUN_ID"
            echo "Native commit: $NATIVE_HEAD_SHA"
            echo "Package commit: $PACKAGE_SOURCE_SHA"
            echo "boot3.img SHA-256: $(shasum -a 256 boot3.img | awk '{print $1}')"
            echo "Package scope: launchd diagnostic RAM boot"
            echo "Device qualification: not run"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: y35a-ramboot-${{ github.run_id }}
          path: ${{ runner.temp }}/y35a-ramboot-package
          if-no-files-found: error
          retention-days: 30
      - name: Verify complete iOS System-volume source handoff
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/y35a-ios12-system-root"
          test -s "$ROOT/system-root.dmg"
          test -s "$ROOT/system-root-source.json"
          (cd "$ROOT" && shasum -a 256 -c SHA256SUMS)
          jq -e '
            .schema_version == 2
            and .status == "full-system-volume-source-verified"
            and .candidate_kind == "pinned-ios12-system-volume-source"
            and .source_component.byte_identical_to_pinned_component == true
            and .gpt_apfs.partition_map_source == "hdiutil-pmap:SCHEME"
            and .scope.system_volume_complete == true
            and .scope.paired_data_volume_present == false
            and .scope.complete_ios_installation == false
            and .qualification.device_ready == false
            and .qualification.runtime_qualified == false
            and .qualification.device_run_allowed == false
            and .writable_state_path_observation == "path metadata only; does not establish writability or a mounted Data volume"
            and (.writable_state_paths | keys == ["private/var", "private/var/db", "private/var/mobile"])
            and ([.writable_state_paths[] |
              ((.present | type) == "boolean"
               and (.entry_type == "missing" or .entry_type == "directory" or .entry_type == "symlink" or .entry_type == "file" or .entry_type == "other")
               and (.resolved_target_exists | type) == "boolean"
               and (.resolved_target_is_directory | type) == "boolean"
               and (.resolution_status == "missing" or .resolution_status == "resolved" or .resolution_status == "link" or .resolution_status == "not-a-directory" or .resolution_status == "symlink-loop" or .resolution_status == "escapes-volume")
               and (.symlink_chain | type) == "array"
               and ((.entry_type == "symlink") == ((.symlink_target | type) == "string"))
               and (.present == (.entry_type != "missing"))
               and (.resolved_target_is_directory == false or .resolved_target_exists == true)
               and (.present == true or (.resolution_status == "missing" and .resolved_target_exists == false and .resolved_target_is_directory == false)))
            ] | all)
          ' "$ROOT/system-root-source.json" > /dev/null
          {
            echo "## Pinned iOS System-volume source"
            echo
            echo "Artifact: y35a-ios12-system-root-${PACKAGE_RUN_ID}"
            echo "System image SHA-256: $(shasum -a 256 "$ROOT/system-root.dmg" | awk '{print $1}')"
            echo "Scope: complete pinned iOS 12.4.1 System volume source; no paired Data volume or Y35A runtime qualification"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PACKAGE_RUN_ID: ${{ github.run_id }}
      - name: Upload pinned iOS System-volume source
        uses: actions/upload-artifact@v4
        with:
          name: y35a-ios12-system-root-${{ github.run_id }}
          path: ${{ runner.temp }}/y35a-ios12-system-root
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload root-tree producer artifact
        uses: actions/upload-artifact@v4
        with:
          name: y35a-root-tree-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/y35a-ramboot-package/root-tree
            ${{ runner.temp }}/y35a-ramboot-package/root-tree.tar
            ${{ runner.temp }}/y35a-ramboot-package/root-tree.metadata.json
            ${{ runner.temp }}/y35a-ramboot-package/rootfs-closure.json
            ${{ runner.temp }}/y35a-ramboot-package/package-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload metadata-preserving root-tree tar without outer ZIP
        uses: actions/upload-artifact@v7
        with:
          name: root-tree.tar
          path: ${{ runner.temp }}/y35a-ramboot-package/root-tree.tar
          archive: false
          if-no-files-found: error
          retention-days: 30

  tf-apfs-intermediate:
    if: github.event_name == 'workflow_dispatch' && inputs.root_tree_run_id != '' && inputs.stock_boot_path != ''
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.root_tree_artifact }}
          run-id: ${{ inputs.root_tree_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/root-tree
      - name: Build and verify TF/APFS intermediate
        env:
          ROOT_TREE_RUN_ID: ${{ inputs.root_tree_run_id }}
          ROOT_TREE_ARTIFACT: ${{ inputs.root_tree_artifact }}
          ROOT_TREE_PATH: ${{ inputs.root_tree_path }}
          STOCK_BOOT_PATH: ${{ inputs.stock_boot_path }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$ROOT_TREE_RUN_ID" =~ ^[0-9]+$ ]]
          test "$ROOT_TREE_ARTIFACT" = "y35a-root-tree-$ROOT_TREE_RUN_ID"
          test "$ROOT_TREE_PATH" = "root-tree.tar"
          ROOT_TREE_ARCHIVE="$RUNNER_TEMP/root-tree/$ROOT_TREE_PATH"
          case "$STOCK_BOOT_PATH" in
            /*|*..*) echo "stock boot path must be a safe repository-relative path" >&2; exit 1 ;;
          esac
          STOCK_BOOT="$GITHUB_WORKSPACE/$STOCK_BOOT_PATH"
          git ls-files --error-unmatch "$STOCK_BOOT_PATH" > /dev/null
          test ! -L "$STOCK_BOOT"
          test -f "$ROOT_TREE_ARCHIVE"
          test -f "$STOCK_BOOT"
          STOCK_QCDT_DIR="$RUNNER_TEMP/stock-qcdt"
          python3 scripts/ci/extract_y35a_stock_qcdt.py \
            --stock-boot-image "$STOCK_BOOT" \
            --source-commit "$SOURCE_COMMIT" \
            --source-boot-repo-path "$STOCK_BOOT_PATH" \
            --output-dir "$STOCK_QCDT_DIR"
          STOCK_QCDT="$STOCK_QCDT_DIR/y35a.qcdt"
          STOCK_PROVENANCE="$STOCK_QCDT_DIR/y35a.qcdt.json"
          jq -e --arg run "$ROOT_TREE_RUN_ID" \
            '.package_source.workflow_run_id == $run and .rootfs.tree_archive.path == "root-tree.tar" and .rootfs.tree_sha256 == .rootfs.tree_archive.tree_sha256' \
            "$RUNNER_TEMP/root-tree/package-provenance.json" > /dev/null
          python3 scripts/ci/build_y35a_tf_apfs_image.py \
            --root-tree-archive "$ROOT_TREE_ARCHIVE" \
            --root-tree-metadata "$RUNNER_TEMP/root-tree/root-tree.metadata.json" \
            --stock-qcdt "$STOCK_QCDT" \
            --stock-qcdt-provenance "$STOCK_PROVENANCE" \
            --stock-boot-image "$STOCK_BOOT" \
            --output "$RUNNER_TEMP/y35a-tf-root.apfs.img"
      - name: Upload TF/APFS intermediate
        uses: actions/upload-artifact@v4
        with:
          name: y35a-tf-apfs-intermediate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/y35a-tf-root.apfs.img
            ${{ runner.temp }}/y35a-tf-root.apfs.img.json
            ${{ runner.temp }}/y35a-tf-root.apfs.img.json.binding.json
          if-no-files-found: error
          retention-days: 30

  tf-apfs-offline-control:
    if: github.event_name == 'workflow_dispatch' && inputs.control_package_run_id != ''
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact diagnostic package run and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.control_package_run_id }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.control_package_artifact_id }}
          PACKAGE_ARTIFACT_DIGEST: ${{ inputs.control_package_artifact_digest }}
          ROOT_TREE_ARTIFACT_ID: ${{ inputs.control_root_tree_artifact_id }}
          ROOT_TREE_ARTIFACT_DIGEST: ${{ inputs.control_root_tree_artifact_digest }}
          PACKAGE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$PACKAGE_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ROOT_TREE_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh run view "$PACKAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,workflowName,conclusion,headBranch,headSha \
            > "$RUNNER_TEMP/control-package-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PACKAGE_ARTIFACT_ID" \
            > "$RUNNER_TEMP/control-package-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ROOT_TREE_ARTIFACT_ID" \
            > "$RUNNER_TEMP/control-root-tree-artifact.json"
          python3 - "$RUNNER_TEMP/control-package-run.json" \
            "$RUNNER_TEMP/control-package-artifact.json" \
            "$RUNNER_TEMP/control-root-tree-artifact.json" \
            "$PACKAGE_RUN_ID" "$PACKAGE_ARTIFACT_ID" "$PACKAGE_ARTIFACT_DIGEST" \
            "$ROOT_TREE_ARTIFACT_ID" "$ROOT_TREE_ARTIFACT_DIGEST" "$PACKAGE_BRANCH" <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/ci")
          from build_y35a_tf_apfs_image import validate_package_artifact_api
          run_path, package_artifact_path, root_artifact_path, run_id, package_artifact_id, package_digest, root_artifact_id, root_digest, branch = sys.argv[1:]
          run = json.loads(Path(run_path).read_text())
          package_artifact = json.loads(Path(package_artifact_path).read_text())
          root_artifact = json.loads(Path(root_artifact_path).read_text())
          validate_package_artifact_api(
              run, package_artifact, package_run_id=run_id, artifact_id=int(package_artifact_id),
              artifact_name=f"y35a-ramboot-{run_id}", artifact_digest=package_digest,
              expected_branch=branch,
          )
          validate_package_artifact_api(
              run, root_artifact, package_run_id=run_id, artifact_id=int(root_artifact_id),
              artifact_name="root-tree.tar", artifact_digest=root_digest,
              expected_branch=branch,
          )
          PY
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.control_package_artifact_id }}
          run-id: ${{ inputs.control_package_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/control-package
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.control_root_tree_artifact_id }}
          run-id: ${{ inputs.control_package_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/control-root-tree
      - name: Build non-bootable derived-QCDT control image
        env:
          PACKAGE_RUN_ID: ${{ inputs.control_package_run_id }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.control_package_artifact_id }}
          PACKAGE_ARTIFACT_DIGEST: ${{ inputs.control_package_artifact_digest }}
          ROOT_TREE_ARTIFACT_ID: ${{ inputs.control_root_tree_artifact_id }}
          ROOT_TREE_ARTIFACT_DIGEST: ${{ inputs.control_root_tree_artifact_digest }}
          PACKAGE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PACKAGE_ROOT="$RUNNER_TEMP/control-package"
          python3 scripts/ci/build_y35a_tf_apfs_image.py \
            --root-tree-archive "$RUNNER_TEMP/control-root-tree/root-tree.tar" \
            --root-tree-metadata "$PACKAGE_ROOT/root-tree.metadata.json" \
            --qcdt "$PACKAGE_ROOT/y35a.qcdt" \
            --qcdt-provenance "$PACKAGE_ROOT/y35a.qcdt.json" \
            --offline-control-derived-qcdt \
            --control-package-root "$PACKAGE_ROOT" \
            --control-package-provenance "$PACKAGE_ROOT/package-provenance.json" \
            --control-package-run-json "$RUNNER_TEMP/control-package-run.json" \
            --control-package-artifact-json "$RUNNER_TEMP/control-package-artifact.json" \
            --control-package-branch "$PACKAGE_BRANCH" \
            --control-package-run-id "$PACKAGE_RUN_ID" \
            --control-package-artifact-name "y35a-ramboot-$PACKAGE_RUN_ID" \
            --control-package-artifact-id "$PACKAGE_ARTIFACT_ID" \
            --control-package-artifact-digest "$PACKAGE_ARTIFACT_DIGEST" \
            --control-root-tree-artifact-json "$RUNNER_TEMP/control-root-tree-artifact.json" \
            --control-root-tree-artifact-id "$ROOT_TREE_ARTIFACT_ID" \
            --control-root-tree-artifact-digest "$ROOT_TREE_ARTIFACT_DIGEST" \
            --output "$RUNNER_TEMP/y35a-tf-offline-control.apfs.img"
          jq -e '.status == "intermediate-built" and .candidate_kind == "derived-qcdt-offline-control" and .qualification == "offline-control-only" and .device_ready == false and .device_run_allowed == false and .bootable == false and .ios_system_image == false and .stock_provenance_status == "not-applicable-derived-input"' \
            "$RUNNER_TEMP/y35a-tf-offline-control.apfs.img.json" > /dev/null
          shasum -a 256 "$RUNNER_TEMP/y35a-tf-offline-control.apfs.img" \
            "$RUNNER_TEMP/y35a-tf-offline-control.apfs.img.json" \
            "$RUNNER_TEMP/y35a-tf-offline-control.apfs.img.json.binding.json"
      - name: Upload offline control intermediate
        uses: actions/upload-artifact@v4
        with:
          name: y35a-tf-apfs-offline-control-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/y35a-tf-offline-control.apfs.img
            ${{ runner.temp }}/y35a-tf-offline-control.apfs.img.json
            ${{ runner.temp }}/y35a-tf-offline-control.apfs.img.json.binding.json
          if-no-files-found: error
          retention-days: 30

  system-root-apfs-control:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.system_root_run_id != ''
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.package_source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve exact System-source run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.system_root_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.system_root_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ inputs.system_root_artifact_digest }}
          EXPECTED_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,workflowName,conclusion,headBranch,headSha \
            > "$RUNNER_TEMP/system-source-run.json"
          jq -e --arg id "$SOURCE_RUN_ID" --arg branch "$EXPECTED_BRANCH" '
            .databaseId == ($id | tonumber)
            and .workflowName == "Y35A CI RAM-boot package"
            and .conclusion == "success"
            and .headBranch == $branch
            and (.headSha | test("^[0-9a-f]{40}$"))
          ' "$RUNNER_TEMP/system-source-run.json" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" \
            > "$RUNNER_TEMP/system-source-artifacts.json"
          SOURCE_ARTIFACT_NAME="y35a-ios12-system-root-$SOURCE_RUN_ID"
          jq -e --arg id "$SOURCE_ARTIFACT_ID" --arg digest "$SOURCE_ARTIFACT_DIGEST" \
            --arg name "$SOURCE_ARTIFACT_NAME" --arg run "$SOURCE_RUN_ID" '
            [.artifacts[] | select((.id|tostring) == $id and .name == $name
              and .digest == $digest and .expired == false
              and .workflow_run.id == ($run|tonumber))] | length == 1
          ' "$RUNNER_TEMP/system-source-artifacts.json" > /dev/null
          jq -c --arg id "$SOURCE_ARTIFACT_ID" \
            '[.artifacts[] | select((.id|tostring) == $id)][0]' \
            "$RUNNER_TEMP/system-source-artifacts.json" > "$RUNNER_TEMP/system-source-artifact.json"
      - name: Download exact System-source artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.system_root_artifact_id }}
          run-id: ${{ inputs.system_root_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/system-source
      - name: Build full-System GPT/APFS offline control
        env:
          SOURCE_RUN_ID: ${{ inputs.system_root_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.system_root_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ inputs.system_root_artifact_digest }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          BUILDER_COMMIT: ${{ needs.validate.outputs.package_source_sha }}
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/system-source/y35a-ios12-system-root-$SOURCE_RUN_ID"
          python3 scripts/ci/build_y35a_system_apfs_control.py \
            --system-image "$SOURCE/system-root.dmg" \
            --system-source-report "$SOURCE/system-root-source.json" \
            --system-run-json "$RUNNER_TEMP/system-source-run.json" \
            --system-artifact-json "$RUNNER_TEMP/system-source-artifact.json" \
            --system-run-id "$SOURCE_RUN_ID" \
            --system-artifact-id "$SOURCE_ARTIFACT_ID" \
            --system-artifact-digest "$SOURCE_ARTIFACT_DIGEST" \
            --expected-branch "$SOURCE_BRANCH" \
            --builder-commit "$BUILDER_COMMIT" \
            --manifest ci/y35a-ci-package-manifest.json \
            --output "$RUNNER_TEMP/y35a-system-root-apfs-control.dmg"
          OUT="$RUNNER_TEMP/y35a-system-root-apfs-control.dmg"
          (cd "$RUNNER_TEMP" && shasum -a 256 -c y35a-system-root-apfs-control.SHA256SUMS)
          REPORT_SHA="$(shasum -a 256 "$OUT.json" | awk '{print $1}')"
          jq -e --arg path "$(basename "$OUT.json")" --arg sha "$REPORT_SHA" \
            '.schema_version == 1 and .report_path == $path and .report_sha256 == $sha' \
            "$OUT.json.binding.json" > /dev/null
          jq -e '
            .status == "offline-system-root-apfs-control-built"
            and .candidate_kind == "pinned-j96ap-system-root-apfs-control"
            and .metadata_round_trip == "passed"
            and .gpt_apfs.partition_map_source == "hdiutil-pmap:SCHEME"
            and .qualification.offline_control_only == true
            and .qualification.bootable == false
            and .qualification.device_run_allowed == false
            and .qualification.y35a_board_qualified == false
            and .qualification.stock_pd1502a_qcdt_bound == false
            and .qualification.root_selection_bound == false
            and .qualification.emmc_fallback_bound == false
            and .target_apfs_volume.uuid != null
            and .target_image.configured_capacity == .image_capacity_plan.size
            and .target_image.capacity_bytes == .image_capacity_plan.capacity_bytes
            and .tree_metadata_manifest.entries > 0
            and .source_system_artifact.artifact_id != null
          ' "$OUT.json" > /dev/null
          jq -e --arg report_tree_sha "$(jq -r '.source_system_tree_sha256' "$OUT.json")" \
            --arg target_tree_sha "$(jq -r '.target_tree_sha256' "$OUT.json")" \
            --arg entries_sha "$(jq -r '.tree_metadata_manifest.entries_sha256' "$OUT.json")" \
            '.tree_sha256 == $report_tree_sha and .target_tree_sha256 == $target_tree_sha
             and .entries_sha256 == $entries_sha and .entries_sha256 == .target_entries_sha256
             and .entry_count > 0' \
            "$OUT.tree-metadata.json" > /dev/null
          {
            echo "## Full-System APFS offline control"
            echo
            echo "Source package run: $SOURCE_RUN_ID"
            echo "Source artifact ID: $SOURCE_ARTIFACT_ID"
            echo "Image SHA-256: $(shasum -a 256 "$OUT" | awk '{print $1}')"
            echo "Selected APFS capacity: $(jq -r '.image_capacity_plan.size' "$OUT.json") ($(jq -r '.image_capacity_plan.capacity_bytes' "$OUT.json") bytes)"
            echo "Source tree file bytes: $(jq -r '.image_capacity_plan.source_file_bytes' "$OUT.json"); reserved APFS metadata bytes: $(jq -r '.image_capacity_plan.apfs_metadata_reserve_bytes' "$OUT.json")"
            echo "Qualification: non-bootable; no Y35A, stock-QCDT, root-selection, or card qualification"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full-System APFS offline control
        uses: actions/upload-artifact@v4
        with:
          name: y35a-system-root-apfs-control-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/y35a-system-root-apfs-control.dmg
            ${{ runner.temp }}/y35a-system-root-apfs-control.dmg.json
            ${{ runner.temp }}/y35a-system-root-apfs-control.dmg.json.binding.json
            ${{ runner.temp }}/y35a-system-root-apfs-control.dmg.tree-metadata.json
            ${{ runner.temp }}/y35a-system-root-apfs-control.SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
