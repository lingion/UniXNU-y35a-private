name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'devices.toml'
      - 'components.toml'
      - 'scripts/porting-record.py'
      - 'scripts/sync-devices.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - uses: actions/upload-artifact@v4
        with:
          name: unixnu-docs-site
          path: docs/.vitepress/dist
