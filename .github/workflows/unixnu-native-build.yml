name: UniXNU native build

on:
  push:
    paths:
      - '.github/workflows/unixnu-native-build.yml'
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository-relative native build manifest with ordered patch hashes
        required: true
        type: string
      source_ref:
        description: Exact XNU source ref
        required: true
        default: 494ffe1c29d37ca720c37328feb83069c9641b67
        type: string
      execute:
        description: Run the native build after plan validation
        required: true
        default: false
        type: boolean
      driver_run_id:
        description: Existing successful R208 driver artifact run
        required: true
        default: '45852497429'
        type: string
      driver_artifact_name:
        description: Driver archive artifact name
        required: true
        default: r208-native-sdcard-45852497429
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: unixnu-native-${{ github.ref }}-${{ inputs.manifest }}-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  native-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 360
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      BUILD_MANIFEST: ${{ inputs.manifest }}
      RUN_ROOT: ${{ github.workspace }}/.ci-runs/unixnu-native-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Xcode
        id: xcode
        run: |
          if [ -n "${DEVELOPER_DIR:-}" ] && [ -d "$DEVELOPER_DIR" ]; then
            true
          else
            export DEVELOPER_DIR="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort | tail -n 1)/Contents/Developer"
          fi
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Fetch exact XNU source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/apple-oss-distributions/xnu.git "$RUNNER_TEMP/xnu"
          git -C "$RUNNER_TEMP/xnu" fetch --depth=1 origin "$SOURCE_REF"
          git -C "$RUNNER_TEMP/xnu" checkout --detach "$SOURCE_REF"
          git -C "$RUNNER_TEMP/xnu" rev-parse HEAD
      - name: Fetch native input sources
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/apple-oss-distributions/AvailabilityVersions.git "$RUNNER_TEMP/AvailabilityVersions"
          git -C "$RUNNER_TEMP/AvailabilityVersions" fetch --depth=1 origin AvailabilityVersions-33.200.7
          git -C "$RUNNER_TEMP/AvailabilityVersions" checkout --detach AvailabilityVersions-33.200.7
          git clone --filter=blob:none --no-checkout https://github.com/apple-oss-distributions/libdispatch.git "$RUNNER_TEMP/libdispatch"
          git -C "$RUNNER_TEMP/libdispatch" fetch --depth=1 origin libdispatch-913.60.2
          git -C "$RUNNER_TEMP/libdispatch" checkout --detach libdispatch-913.60.2
          git clone --filter=blob:none --no-checkout https://github.com/apple-oss-distributions/libplatform.git "$RUNNER_TEMP/libplatform"
          git -C "$RUNNER_TEMP/libplatform" fetch --depth=1 origin libplatform-177.270.1
          git -C "$RUNNER_TEMP/libplatform" checkout --detach libplatform-177.270.1
          git clone --filter=blob:none --no-checkout https://github.com/llvm/llvm-project.git "$RUNNER_TEMP/llvm-project"
          git -C "$RUNNER_TEMP/llvm-project" fetch --depth=1 origin 58c46bae21181fb4240cf964461bea738d96d50e
          git -C "$RUNNER_TEMP/llvm-project" checkout --detach 58c46bae21181fb4240cf964461bea738d96d50e
          git clone --filter=blob:none --no-checkout https://github.com/apple-oss-distributions/Libc.git "$RUNNER_TEMP/Libc"
          git -C "$RUNNER_TEMP/Libc" fetch --depth=1 origin 899a3b2d52d95d75e05fb286a5e64975ec3de757
          git -C "$RUNNER_TEMP/Libc" checkout --detach 899a3b2d52d95d75e05fb286a5e64975ec3de757
      - name: Download hash-bound R208 driver archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/r208-driver"
          gh run download "${{ inputs.driver_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ inputs.driver_artifact_name }}" \
            --dir "$RUNNER_TEMP/r208-driver"
          test -f "$RUNNER_TEMP/r208-driver/libQcomSdcard.a"
          test -f "$RUNNER_TEMP/r208-driver/driver-manifest.json"
      - name: Prepare exact native inputs
        run: |
          python scripts/ci/prepare_native_inputs.py \
            --xnu-source "$RUNNER_TEMP/xnu" \
            --availability-source "$RUNNER_TEMP/AvailabilityVersions" \
            --libdispatch-source "$RUNNER_TEMP/libdispatch" \
            --libplatform-source "$RUNNER_TEMP/libplatform" \
            --llvm-source "$RUNNER_TEMP/llvm-project" \
            --libc-source "$RUNNER_TEMP/Libc" \
            --repo-root "$GITHUB_WORKSPACE" \
            --developer-dir "$DEVELOPER_DIR" \
            --iphoneos-sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            --macosx-sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            --run-root "$RUNNER_TEMP/native-inputs" \
            --jobs 4
      - name: Validate native manifest and print command
        run: |
          python scripts/ci/run_native_build.py \
            --manifest "$BUILD_MANIFEST" \
            --source-root "$RUNNER_TEMP/xnu" \
            --run-root "$RUN_ROOT" \
            --developer-dir "$DEVELOPER_DIR" \
            --repo-root "$GITHUB_WORKSPACE" \
            --fakeroot "$RUNNER_TEMP/native-inputs/fakeroot" \
            --sdk-overlay "$RUNNER_TEMP/native-inputs/sdk-overlay" \
            --xcrun-wrapper "$RUNNER_TEMP/native-inputs/compat/bin/xcrun" \
            --driver-archive "$RUNNER_TEMP/r208-driver/libQcomSdcard.a" \
            --driver-manifest "$RUNNER_TEMP/r208-driver/driver-manifest.json" \
            --plan-only | tee "$RUNNER_TEMP/native-build-plan.json"
      - name: Run native build
        if: inputs.execute == true
        run: |
          python scripts/ci/run_native_build.py \
            --manifest "$BUILD_MANIFEST" \
            --source-root "$RUNNER_TEMP/xnu" \
            --run-root "$RUN_ROOT" \
            --developer-dir "$DEVELOPER_DIR" \
            --repo-root "$GITHUB_WORKSPACE" \
            --fakeroot "$RUNNER_TEMP/native-inputs/fakeroot" \
            --sdk-overlay "$RUNNER_TEMP/native-inputs/sdk-overlay" \
            --xcrun-wrapper "$RUNNER_TEMP/native-inputs/compat/bin/xcrun" \
            --driver-archive "$RUNNER_TEMP/r208-driver/libQcomSdcard.a" \
            --driver-manifest "$RUNNER_TEMP/r208-driver/driver-manifest.json"
      - name: Upload build provenance and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-native-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-build-plan.json
            ${{ runner.temp }}/native-inputs/native-inputs-manifest.json
            ${{ runner.temp }}/unixnu-native-build/**/build-provenance.json
            ${{ runner.temp }}/unixnu-native-build/**/logs/**
          if-no-files-found: warn
