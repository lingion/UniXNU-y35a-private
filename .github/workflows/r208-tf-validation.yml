name: R208 TF validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/manifests/r208-tf-sd-driver.json'
      - 'ci/native-build-manifest.r208.json'
      - 'scripts/ci/validate_r208_tf_manifest.py'
      - 'scripts/ci/compile_r208_sdcard.py'
      - 'drivers/QcomSdcard/**'
      - 'scripts/y35a/make_adt.py'
      - 'scripts/y35a/test_board_adt.py'
      - 'scripts/y35a/verify_sd_root_fallback_contract.py'
      - 'tests/test_y35a_sd_root_fallback_contract.py'
      - 'tests/test_r208_storage_abi_contract.py'
      - 'tests/test_native_xnu_build_contract.py'
      - 'tests/test_r208_native_kernel_gate.py'
      - 'tests/test_ci_native_build_gate.py'
      - 'scripts/ci/run_native_build.py'
      - 'scripts/ci/prepare_native_inputs.py'
      - 'scripts/build-xnu-4903-native.py'
      - 'ci/manifests/r208-root-fallback-contract.json'
      - 'patches/lk2nd/msm8916-sd-boot.patch'
      - 'patches/arm-driver-4903/0006-qcom-sdcard-personality.patch'

permissions:
  contents: read

jobs:
  offline:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record Xcode toolchain
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Emit manifest source hash audit
        run: |
          python3 - "$GITHUB_WORKSPACE" ci/manifests/r208-tf-sd-driver.json "$RUNNER_TEMP/r208-source-hash-audit.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          root, manifest_path, output_path = map(Path, sys.argv[1:])
          manifest = json.loads(manifest_path.read_text())
          names = set(manifest.get("source_files", {}))
          names.update({
              "scripts/ci/run_native_build.py",
              "tests/test_native_xnu_build_contract.py",
              "tests/test_ci_native_build_gate.py",
              "ci/native-source-provenance.r208.json",
          })
          result = {}
          for name in sorted(names):
              path = root / name
              if path.is_file():
                  result[name] = hashlib.sha256(path.read_bytes()).hexdigest()
              else:
                  result[name] = None
          output_path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Upload manifest source hash audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r208-source-hash-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/r208-source-hash-audit.json
          if-no-files-found: warn
      - name: Validate manifest
        run: python scripts/ci/validate_r208_tf_manifest.py --manifest ci/manifests/r208-tf-sd-driver.json --repo-root .
      - name: Run SD host suite
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror drivers/QcomSdcard/Test/sdcard_host.cpp -o /tmp/sdcard_host_test
          /tmp/sdcard_host_test
      - name: Run ADT contract
        run: (cd scripts/y35a && python3 -m unittest -v test_board_adt)
      - name: Run root-selection contract tests
        run: python3 -m unittest -v tests/test_y35a_root_selection_contract.py
      - name: Run TF and eMMC fallback contract
        run: |
          python3 -m unittest -v tests/test_y35a_sd_root_fallback_contract.py
          python3 scripts/y35a/verify_sd_root_fallback_contract.py \
            --contract ci/manifests/r208-root-fallback-contract.json
      - name: Test embedded KEXT ABI contract
        run: python3 -m unittest -v tests/test_r208_storage_abi_contract.py
      - name: Test native link input binding contracts
        run: python3 -m unittest -v tests/test_native_xnu_build_contract.py tests/test_ci_native_build_gate.py tests/test_r208_native_kernel_gate.py
      - name: Fetch exact XNU source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/apple-oss-distributions/xnu.git "$RUNNER_TEMP/xnu"
          git -C "$RUNNER_TEMP/xnu" fetch --depth=1 origin 494ffe1c29d37ca720c37328feb83069c9641b67
          git -C "$RUNNER_TEMP/xnu" checkout --detach 494ffe1c29d37ca720c37328feb83069c9641b67
          test "$(git -C "$RUNNER_TEMP/xnu" rev-parse HEAD)" = 494ffe1c29d37ca720c37328feb83069c9641b67
      - name: Fetch exact IOStorageFamily source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/apple-oss-distributions/IOStorageFamily.git "$RUNNER_TEMP/IOStorageFamily"
          git -C "$RUNNER_TEMP/IOStorageFamily" fetch --depth=1 origin 0e637763592184691a0e51a0995f10fa110f0780
          git -C "$RUNNER_TEMP/IOStorageFamily" checkout --detach 0e637763592184691a0e51a0995f10fa110f0780
          test "$(git -C "$RUNNER_TEMP/IOStorageFamily" rev-parse HEAD)" = 0e637763592184691a0e51a0995f10fa110f0780
      - name: Generate exact XNU headers
        run: |
          python scripts/ci/patch_xnu_host_tools.py --xnu-source "$RUNNER_TEMP/xnu"
          git -C "$RUNNER_TEMP/xnu" apply --check "$GITHUB_WORKSPACE/patches/xnu/local-availability.patch"
          git -C "$RUNNER_TEMP/xnu" apply "$GITHUB_WORKSPACE/patches/xnu/local-availability.patch"
          git clone --filter=blob:none --no-checkout https://github.com/apple-oss-distributions/AvailabilityVersions.git "$RUNNER_TEMP/AvailabilityVersions"
          git -C "$RUNNER_TEMP/AvailabilityVersions" fetch --depth=1 origin AvailabilityVersions-33.200.7
          git -C "$RUNNER_TEMP/AvailabilityVersions" checkout --detach AvailabilityVersions-33.200.7
          export XNU_AVAILABILITY_PL="$RUNNER_TEMP/availability-dst/usr/local/libexec/availability.pl"
          make -C "$RUNNER_TEMP/AvailabilityVersions" install \
            SRCROOT="$RUNNER_TEMP/AvailabilityVersions" \
            OBJROOT="$RUNNER_TEMP/availability-obj" SYMROOT="$RUNNER_TEMP/availability-sym" \
            DSTROOT="$RUNNER_TEMP/availability-dst" CMAKE="$(command -v cmake)" NINJA="$(command -v ninja)"
          make -C "$RUNNER_TEMP/xnu" \
            ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT \
            SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            OBJROOT="$RUNNER_TEMP/xnu-obj" \
            DSTROOT="$RUNNER_TEMP/xnu-dst" \
            SDKVERSION=12.4 PLATFORM=iPhoneOS ARCH_CONFIGS=ARM64 MACHINE_CONFIGS=T7001 \
            ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG=arm64 \
            HOST_CC="$(xcrun --find clang)" \
            MIG="$(xcrun --find mig)" \
            MIGCOM="$(xcrun --find migcom)" \
            HOST_OS_VERSION="$(sw_vers -productVersion)" \
            CTFCONVERT=/usr/bin/true CTFMERGE=/usr/bin/true CTFINSERT=/usr/bin/true \
            EMBEDDED_DEVICE_MAP=/usr/bin/true TIGHTBEAMC=tightbeamc-not-supported \
            XNU_AVAILABILITY_PL="$XNU_AVAILABILITY_PL" \
            installhdrs
      - name: Compile NativeSdcard object
        run: |
          python scripts/ci/compile_r208_sdcard.py \
            --xnu-source "$RUNNER_TEMP/xnu" \
            --generated-headers "$RUNNER_TEMP/xnu-dst" \
            --iostorage-source "$RUNNER_TEMP/IOStorageFamily" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/r208/NativeSdcard.o"
      - name: Verify produced driver artifact against pinned contract
        run: |
          python3 - "$GITHUB_WORKSPACE/ci/manifests/r208-tf-sd-driver.json" \
            "$RUNNER_TEMP/r208/compile-report.json" "$RUNNER_TEMP/r208/driver-manifest.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          manifest_path, report_path, driver_manifest_path = map(Path, sys.argv[1:])
          contract = json.loads(manifest_path.read_text())
          report = json.loads(report_path.read_text())
          driver = json.loads(driver_manifest_path.read_text())
          expected = contract["expected"]["driver_archive_sha256"]
          archive = report.get("archive", {})
          if archive.get("sha256") != expected:
              raise SystemExit("produced driver archive SHA does not match the R208 manifest")
          if archive.get("size", 0) <= 0:
              raise SystemExit("produced driver archive has invalid size")
          if driver.get("archive", {}).get("sha256") != archive.get("sha256"):
              raise SystemExit("driver manifest archive hash differs from compile report")
          if report.get("source_sha256") != contract["driver"]["source_sha256"]["drivers/QcomSdcard/NativeSdcard.cpp"]:
              raise SystemExit("compiled NativeSdcard source hash does not match the R208 manifest")
          if report.get("xnu_commit") != contract["source"]["commit"]:
              raise SystemExit("driver compile XNU commit does not match the R208 manifest")
          if report.get("iostorage_commit") != "0e637763592184691a0e51a0995f10fa110f0780":
              raise SystemExit("driver compile IOStorageFamily commit does not match the R208 pin")
          abi = driver.get("kext_abi", {})
          if (abi.get("status") != "passed" or abi.get("config_embedded") != 1
                  or abi.get("apple_kext_vtable_padding") != 0
                  or abi.get("apple_kext_align_containers") != 1):
              raise SystemExit("driver manifest has no passing embedded KEXT ABI binding")
          if driver.get("archive_kext_abi", {}).get("reserved_abi_imports") != []:
              raise SystemExit("driver archive has reserved KEXT ABI imports")
          provenance = driver.get("ci_provenance", {})
          if (provenance.get("run_id") != int(__import__("os").environ["GITHUB_RUN_ID"])
                  or provenance.get("head_sha") != __import__("os").environ["GITHUB_SHA"]
                  or provenance.get("head_branch") != __import__("os").environ["GITHUB_REF_NAME"]
                  or provenance.get("workflow_name") != "R208 TF validation"):
              raise SystemExit("driver producer provenance does not bind this Actions run")
          print(json.dumps({
              "ok": True,
              "run_id": provenance["run_id"],
              "head_sha": provenance["head_sha"],
              "archive_sha256": archive["sha256"],
              "archive_bytes": archive["size"],
              "driver_manifest_sha256": hashlib.sha256(driver_manifest_path.read_bytes()).hexdigest(),
          }, indent=2))
          PY
      - name: Upload R208 compile artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r208-native-sdcard-${{ github.run_id }}
          path: ${{ runner.temp }}/r208/
          if-no-files-found: warn
          retention-days: 90
