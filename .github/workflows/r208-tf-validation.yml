name: R208 TF validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/manifests/r208-tf-sd-driver.json'
      - 'scripts/ci/validate_r208_tf_manifest.py'
      - 'drivers/QcomSdcard/**'
      - 'scripts/y35a/make_adt.py'
      - 'scripts/y35a/test_board_adt.py'
      - 'scripts/y35a/verify_sd_root_fallback_contract.py'
      - 'tests/test_y35a_sd_root_fallback_contract.py'
      - 'ci/manifests/r208-root-fallback-contract.json'
      - 'patches/lk2nd/msm8916-sd-boot.patch'
      - 'patches/arm-driver-4903/0006-qcom-sdcard-personality.patch'

permissions:
  contents: read

jobs:
  offline:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record Xcode toolchain
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Validate manifest
        run: python scripts/ci/validate_r208_tf_manifest.py --manifest ci/manifests/r208-tf-sd-driver.json --repo-root .
      - name: Run SD host suite
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror drivers/QcomSdcard/Test/sdcard_host.cpp -o /tmp/sdcard_host_test
          /tmp/sdcard_host_test
      - name: Run ADT contract
        run: (cd scripts/y35a && python3 -m unittest -v test_board_adt)
      - name: Run root-selection contract tests
        run: python3 -m unittest -v tests/test_y35a_root_selection_contract.py
      - name: Run TF and eMMC fallback contract
        run: |
          python3 -m unittest -v tests/test_y35a_sd_root_fallback_contract.py
          python3 scripts/y35a/verify_sd_root_fallback_contract.py \
            --contract ci/manifests/r208-root-fallback-contract.json
      - name: Fetch exact XNU source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/apple-oss-distributions/xnu.git "$RUNNER_TEMP/xnu"
          git -C "$RUNNER_TEMP/xnu" fetch --depth=1 origin 494ffe1c29d37ca720c37328feb83069c9641b67
          git -C "$RUNNER_TEMP/xnu" checkout --detach 494ffe1c29d37ca720c37328feb83069c9641b67
          test "$(git -C "$RUNNER_TEMP/xnu" rev-parse HEAD)" = 494ffe1c29d37ca720c37328feb83069c9641b67
      - name: Fetch exact IOStorageFamily source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/apple-oss-distributions/IOStorageFamily.git "$RUNNER_TEMP/IOStorageFamily"
          git -C "$RUNNER_TEMP/IOStorageFamily" fetch --depth=1 origin c95d31401f0ff950a883727f5e47d313685fde33
          git -C "$RUNNER_TEMP/IOStorageFamily" checkout --detach c95d31401f0ff950a883727f5e47d313685fde33
          test "$(git -C "$RUNNER_TEMP/IOStorageFamily" rev-parse HEAD)" = c95d31401f0ff950a883727f5e47d313685fde33
      - name: Generate exact XNU headers
        run: |
          python scripts/ci/patch_xnu_host_tools.py --xnu-source "$RUNNER_TEMP/xnu"
          git -C "$RUNNER_TEMP/xnu" apply --check "$GITHUB_WORKSPACE/patches/xnu/local-availability.patch"
          git -C "$RUNNER_TEMP/xnu" apply "$GITHUB_WORKSPACE/patches/xnu/local-availability.patch"
          git clone --filter=blob:none --no-checkout https://github.com/apple-oss-distributions/AvailabilityVersions.git "$RUNNER_TEMP/AvailabilityVersions"
          git -C "$RUNNER_TEMP/AvailabilityVersions" fetch --depth=1 origin AvailabilityVersions-33.200.7
          git -C "$RUNNER_TEMP/AvailabilityVersions" checkout --detach AvailabilityVersions-33.200.7
          export XNU_AVAILABILITY_PL="$RUNNER_TEMP/availability-dst/usr/local/libexec/availability.pl"
          make -C "$RUNNER_TEMP/AvailabilityVersions" install \
            SRCROOT="$RUNNER_TEMP/AvailabilityVersions" \
            OBJROOT="$RUNNER_TEMP/availability-obj" SYMROOT="$RUNNER_TEMP/availability-sym" \
            DSTROOT="$RUNNER_TEMP/availability-dst" CMAKE="$(command -v cmake)" NINJA="$(command -v ninja)"
          make -C "$RUNNER_TEMP/xnu" \
            ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT \
            SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            OBJROOT="$RUNNER_TEMP/xnu-obj" \
            DSTROOT="$RUNNER_TEMP/xnu-dst" \
            SDKVERSION=12.4 PLATFORM=iPhoneOS ARCH_CONFIGS=ARM64 MACHINE_CONFIGS=T7001 \
            ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG=arm64 \
            HOST_CC="$(xcrun --find clang)" \
            MIG="$(xcrun --find mig)" \
            MIGCOM="$(xcrun --find migcom)" \
            HOST_OS_VERSION="$(sw_vers -productVersion)" \
            CTFCONVERT=/usr/bin/true CTFMERGE=/usr/bin/true CTFINSERT=/usr/bin/true \
            EMBEDDED_DEVICE_MAP=/usr/bin/true TIGHTBEAMC=tightbeamc-not-supported \
            XNU_AVAILABILITY_PL="$XNU_AVAILABILITY_PL" \
            installhdrs
      - name: Compile NativeSdcard object
        run: |
          python scripts/ci/compile_r208_sdcard.py \
            --xnu-source "$RUNNER_TEMP/xnu" \
            --generated-headers "$RUNNER_TEMP/xnu-dst" \
            --iostorage-source "$RUNNER_TEMP/IOStorageFamily" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/r208/NativeSdcard.o"
      - name: Upload R208 compile artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r208-native-sdcard-${{ github.run_id }}
          path: ${{ runner.temp }}/r208/
          if-no-files-found: warn
